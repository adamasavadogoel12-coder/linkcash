<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard – MonSiteLink</title>
</head>
<body>
  <h1>Dashboard</h1>
  <p>Bonjour {{ user.username }} – <a href="{% url 'create_link' %}">Créer un lien</a></p>

  <h2>Tes liens</h2>
  <ul>
    {% for link in links %}
      <li>
        {{ link.original_url }} → 
        <a href="/s/{{ link.slug }}/" target="_blank">/s/{{ link.slug }}/</a>
        ({{ link.clicks.count }} clics)
      </li>
    {% empty %}
      <li>Aucun lien pour le moment.</li>
    {% endfor %}
  </ul>
</body>
</html>
