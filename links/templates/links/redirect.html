<!DOCTYPE html>
<html lang="fr">
<head>

  <title>Redirection – MonSiteLink</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;

<body>

  {{ hilltop_code|safe }}

    }, 3000);
