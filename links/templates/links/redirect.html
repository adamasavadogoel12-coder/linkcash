<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Redirection – MonSiteLink</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.5;
      text-align: center;
    }
    #continue-btn {
      margin-top: 20px;
      padding: 15px 30px;
      font-size: 18px;
      cursor: pointer;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <p>Clique sur le bouton pour accéder à la vidéo</p>

  <button id="continue-btn">Continuer vers la vidéo ▶</button>

  <!-- Code HilltopAds (popunder) -->
  {{ hilltop_code|safe }}

  <script>
    document.getElementById('continue-btn').addEventListener('click', function() {
      // Le clic déclenche le popunder (géré par le script HilltopAds ci-dessus)
      // On redirige juste après vers la vidéo
      window.location.href = "{{ destination_url }}";
    });
  </script>
</body>
</html>
