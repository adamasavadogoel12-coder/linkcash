{% extends 'links/base.html' %}
{% block title %}Créer un lien – MonSiteLink{% endblock %}
{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
  <h2 style="margin-top:0;">Créer un nouveau lien</h2>
  <form method="post">
    {% csrf_token %}
    <label>URL de la vidéo</label>
    <input type="url" name="original_url" required placeholder="https://...">
    <button type="submit" class="btn btn-primary" style="width:100%; margin-top:10px;">Créer le lien</button>
  </form>
</div>
{% endblock %}
