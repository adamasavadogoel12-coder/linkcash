{% extends 'links/base.html' %}
{% block title %}Se connecter – MonSiteLink{% endblock %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 0 auto;">
  <h2 style="text-align:center; margin-top:0;">Se connecter</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary" style="width:100%;">Se connecter</button>
  </form>
  <p style="text-align:center; margin-top:16px;">Pas encore de compte ? <a href="{% url 'signup' %}">Créer un compte</a></p>
</div>
{% endblock %}
