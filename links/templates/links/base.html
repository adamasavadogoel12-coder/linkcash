<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}MonSiteLink{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --primary: #059669;
      --primary-dark: #047857;
      --bg: #f0fdf4;
      --text: #1e293b;
      --text-light: #64748b;
      --success: #16a34a;
      --border: #c2410c;
      --card-shadow: 0 1px 3px rgba(194,65,12,0.12);
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    nav {
      background: white;
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    nav .logo {
      font-weight: bold;
      font-size: 20px;
      color: var(--primary);
      text-decoration: none;
    }
    nav .nav-links {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    nav .nav-links a {
      text-decoration: none;
      color: var(--text);
      font-size: 15px;
    }
    nav .username {
      color: var(--text-light);
      font-size: 14px;
    }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      font-size: 15px;
      border: none;
      cursor: pointer;
    }
    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-outline {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }
    main {
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      flex: 1;
      width: 100%;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border);
      padding: 24px;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
    }
    .errorlist {
      color: #dc2626;
      font-size: 14px;
      list-style: none;
      padding: 0;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: var(--text-light);
      font-size: 14px;
      border-top: 1px solid var(--border);
      background: white;
    }
    footer a {
      color: #25D366;
      font-weight: bold;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <nav>
    <a href="{% url 'home' %}" class="logo">MonSiteLink</a>
    <div class="nav-links">
      {% if user.is_authenticated %}
        <span class="username">👤 {{ user.username }}</span>
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <a href="{% url 'create_link' %}" class="btn btn-primary">+ Créer un lien</a>
        <a href="{% url 'logout' %}">Déconnexion</a>
      {% else %}
        <a href="{% url 'login' %}">Se connecter</a>
        <a href="{% url 'signup' %}" class="btn btn-primary">Créer un compte</a>
      {% endif %}
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    Une question ? Contacte-nous sur
    <a href="https://wa.me/212679750760" target="_blank">WhatsApp</a>
  </footer>
</body>
</html>
